# Application Configuration
spring.application.name=CinnamonProducts
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinnamon_products?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
