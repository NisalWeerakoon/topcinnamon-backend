<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'DM Sans', sans-serif;
            background-color: #121212;
            min-height: 100vh;
            color: #ffaf6e;
            line-height: 1.6;
        }

        .header {
            background-color: rgba(18, 18, 18, 0.95);
            padding: 2rem;
            border-bottom: 1px solid rgba(200, 169, 126, 0.3);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #edd4b1;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .btn-back {
            background-color: #edd4b1;
            color: #121212;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background-color: #ffaf6e;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .order-list-section {
            background-color: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(200, 169, 126, 0.3);
            border-radius: 10px;
            padding: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            color: #edd4b1;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
        }

        .order-table th,
        .order-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(200, 169, 126, 0.3);
        }

        .order-table th {
            color: #edd4b1;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .order-table td {
            color: #ffaf6e;
        }

        .order-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-delivered {
            background: #28a745;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            border: none;
        }

        .btn-delivered:hover {
            background: #218838;
        }

        .btn-delivered:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .status-completed {
            background: #28a745;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #ffaf6e;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1><i class="fas fa-shopping-bag"></i> Order Management</h1>
            <a href="admin-dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div class="container">
        <div class="order-list-section">
            <div class="section-header">
                <h2><i class="fas fa-list"></i> All Orders</h2>
                <button class="btn-back" onclick="loadOrders()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="orderList">
                <div class="loading">Loading orders...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/payment/all`);
                const payments = await response.json();
                
                // Filter only completed payments (orders)
                const orders = payments.filter(payment => payment.status === 'COMPLETED');
                
                if (orders.length === 0) {
                    document.getElementById('orderList').innerHTML = 
                        '<div style="text-align: center; padding: 2rem; color: #ffaf6e;">No orders found</div>';
                    return;
                }

                let html = '<table class="order-table"><thead><tr>';
                html += '<th>Order ID</th>';
                html += '<th>Customer</th>';
                html += '<th>Amount</th>';
                html += '<th>Status</th>';
                html += '<th>Date</th>';
                html += '<th>Actions</th>';
                html += '</tr></thead><tbody>';

                orders.forEach(payment => {
                    html += `<tr>`;
                    html += `<td>${payment.paymentId}</td>`;
                    html += `<td>${payment.customerEmail}</td>`;
                    html += `<td>Rs. ${parseFloat(payment.amount).toFixed(2)}</td>`;
                    html += `<td><span class="status-completed">Delivered</span></td>`;
                    html += `<td>${new Date(payment.createdAt).toLocaleString()}</td>`;
                    html += `<td>`;
                    html += `<button class="btn-delivered" disabled>Delivered</button>`;
                    html += `</td>`;
                    html += `</tr>`;
                });

                html += '</tbody></table>';
                document.getElementById('orderList').innerHTML = html;
            } catch (error) {
                document.getElementById('orderList').innerHTML = 
                    `<div style="text-align: center; padding: 2rem; color: #dc3545;">Error: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
