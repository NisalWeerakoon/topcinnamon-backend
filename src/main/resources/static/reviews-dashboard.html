<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamon Products - Reviews Management Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #1e3c72;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #6c757d;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00a085, #008f7a);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #d63031, #c0392b);
            box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4);
        }

        .review-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .review-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .review-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .review-id {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .review-rating {
            display: flex;
            gap: 2px;
        }

        .star {
            color: #ffc107;
            font-size: 14px;
        }

        .star.empty {
            color: #ddd;
        }

        .review-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .review-details {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .review-content {
            margin-top: 10px;
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.4;
        }

        .response-area {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-star"></i> Reviews Management</h1>
            <p class="subtitle">Manage customer reviews and ratings</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalReviews">-</div>
                <div class="stat-label">Total Reviews</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingReviews">-</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedReviews">-</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="averageRating">-</div>
                <div class="stat-label">Avg Rating</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2><i class="fas fa-cogs"></i> Review Management</h2>
                <div style="margin-bottom: 25px;">
                    <button onclick="loadReviewStats()" class="btn"><i class="fas fa-sync-alt"></i> Refresh Stats</button>
                    <button onclick="loadPendingReviews()" class="btn"><i class="fas fa-list"></i> Load Pending</button>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-search"></i> Review ID to Lookup</label>
                    <input type="text" id="lookupReviewId" placeholder="Enter Review ID">
                    <button onclick="lookupReview()" class="btn"><i class="fas fa-search"></i> Lookup Review</button>
                </div>

                <div class="form-group">
                    <label>Action</label>
                    <select id="reviewAction">
                        <option value="approve">Approve</option>
                        <option value="reject">Reject</option>
                        <option value="delete">Delete</option>
                    </select>
                    <button onclick="performReviewAction()" class="btn btn-success"><i class="fas fa-check"></i> Perform Action</button>
                </div>

                <div class="form-group">
                    <button onclick="approveAllPending()" class="btn btn-success"><i class="fas fa-check-double"></i> Approve All Pending</button>
                </div>

                <div class="response-area" id="managementResponse"></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-chart-line"></i> Recent Reviews</h2>
                <div class="loading" id="loadingReviews">
                    <div class="spinner"></div>
                    <p>Loading reviews...</p>
                </div>
                <div class="review-list" id="reviewList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadReviewStats();
        });

        async function loadReviewStats() {
            try {
                const response = await fetch(`${API_BASE}/reviews/admin/dashboard/stats`);
                const stats = await response.json();
                
                document.getElementById('totalReviews').textContent = stats.totalReviews || 0;
                document.getElementById('pendingReviews').textContent = stats.totalSubmitted || 0;
                document.getElementById('approvedReviews').textContent = stats.totalApproved || 0;
                document.getElementById('averageRating').textContent = '4.5'; // We'll calculate this later
            } catch (error) {
                console.error('Error loading stats:', error);
                // Fallback to mock data if API fails
                document.getElementById('totalReviews').textContent = '0';
                document.getElementById('pendingReviews').textContent = '0';
                document.getElementById('approvedReviews').textContent = '0';
                document.getElementById('averageRating').textContent = '0';
            }
        }

        async function loadPendingReviews() {
            const loading = document.getElementById('loadingReviews');
            const reviewList = document.getElementById('reviewList');
            
            loading.style.display = 'block';
            reviewList.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/reviews/admin/submitted`);
                const reviews = await response.json();

                if (reviews.length === 0) {
                    reviewList.innerHTML = '<div class="no-reviews">No pending reviews found.</div>';
                    return;
                }

                reviews.forEach(review => {
                    const reviewItem = document.createElement('div');
                    reviewItem.className = 'review-item';
                    reviewItem.innerHTML = `
                        <div class="review-header">
                            <div class="review-id">Review ID: ${review.id}</div>
                            <div class="review-rating">
                                ${renderStars(review.rating)}
                            </div>
                            <span class="review-status status-${review.status.toLowerCase()}">${review.status}</span>
                        </div>
                        <div class="review-details">
                            Product: ${review.productName} | Customer: ${review.customerName}<br>
                            Created: ${new Date(review.createdAt).toLocaleString()}
                        </div>
                        <div class="review-content">
                            <strong>${review.reviewTitle}</strong><br>
                            ${review.comment}
                        </div>
                        <div class="review-actions">
                            <button onclick="approveReview(${review.id})" class="btn btn-success">Approve</button>
                            <button onclick="rejectReview(${review.id})" class="btn btn-danger">Reject</button>
                        </div>
                    `;
                    reviewList.appendChild(reviewItem);
                });
            } catch (error) {
                reviewList.innerHTML = '<div class="error">Error loading reviews: ' + error.message + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<i class="fas fa-star star ${i <= rating ? '' : 'empty'}"></i>`;
            }
            return stars;
        }

        async function approveReview(reviewId) {
            try {
                const response = await fetch(`${API_BASE}/reviews/admin/${reviewId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminNotes: 'Approved by admin'
                    })
                });

                if (response.ok) {
                    alert('Review approved successfully!');
                    loadPendingReviews(); // Refresh the list
                    loadReviewStats(); // Refresh stats
                } else {
                    const error = await response.text();
                    alert('Error approving review: ' + error);
                }
            } catch (error) {
                alert('Error approving review: ' + error.message);
            }
        }

        async function rejectReview(reviewId) {
            try {
                const response = await fetch(`${API_BASE}/reviews/admin/${reviewId}/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminNotes: 'Rejected by admin'
                    })
                });

                if (response.ok) {
                    alert('Review rejected successfully!');
                    loadPendingReviews(); // Refresh the list
                    loadReviewStats(); // Refresh stats
                } else {
                    const error = await response.text();
                    alert('Error rejecting review: ' + error);
                }
            } catch (error) {
                alert('Error rejecting review: ' + error.message);
            }
        }

        async function lookupReview() {
            const reviewId = document.getElementById('lookupReviewId').value;
            if (!reviewId) {
                displayResponse('managementResponse', { error: 'Please enter a Review ID' }, false);
                return;
            }

            try {
                // Mock review lookup
                const mockReview = {
                    id: reviewId,
                    productId: 1,
                    productName: 'Cinnamon Sticks',
                    customerName: 'John Doe',
                    customerEmail: 'john@example.com',
                    rating: 5,
                    title: 'Excellent quality!',
                    comment: 'Great product, fast shipping. Highly recommended!',
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    adminNotes: null
                };

                displayResponse('managementResponse', mockReview, true);
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function performReviewAction() {
            const reviewId = document.getElementById('lookupReviewId').value;
            const action = document.getElementById('reviewAction').value;
            
            if (!reviewId) {
                displayResponse('managementResponse', { error: 'Please enter a Review ID' }, false);
                return;
            }

            const confirmAction = confirm(
                `Are you sure you want to ${action.toUpperCase()} review ${reviewId}?\n\n` +
                `This action cannot be undone.`
            );

            if (!confirmAction) {
                displayResponse('managementResponse', { message: 'Action cancelled by user' }, true);
                return;
            }

            try {
                // Mock review action
                displayResponse('managementResponse', {
                    success: true,
                    message: `Review ${action}d successfully`,
                    reviewId: reviewId,
                    action: action,
                    timestamp: new Date().toISOString()
                }, true);
                
                loadReviewStats();
                loadPendingReviews();
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function approveAllPending() {
            const confirmApprove = confirm(
                `Are you sure you want to approve ALL pending reviews?\n\n` +
                `This will approve all reviews that are currently pending.`
            );

            if (!confirmApprove) {
                displayResponse('managementResponse', { message: 'Operation cancelled by user' }, true);
                return;
            }

            try {
                // Mock approve all pending
                displayResponse('managementResponse', {
                    success: true,
                    message: 'All pending reviews approved successfully',
                    approvedCount: 8,
                    timestamp: new Date().toISOString()
                }, true);
                
                loadReviewStats();
                loadPendingReviews();
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        function displayResponse(elementId, data, isSuccess) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleString();
            
            let responseText = `[${timestamp}] ${isSuccess ? '✅ SUCCESS' : '❌ ERROR'}\n`;
            responseText += JSON.stringify(data, null, 2);
            
            element.textContent = responseText;
            element.className = `response-area ${isSuccess ? 'success' : 'error'}`;
            
            // Auto-scroll to show the response
            element.scrollTop = element.scrollHeight;
        }
    </script>
</body>
</html>
