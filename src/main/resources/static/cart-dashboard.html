<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamon Products - Cart Management Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #1e3c72;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #6c757d;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00a085, #008f7a);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #d63031, #c0392b);
            box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4);
        }

        .cart-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .cart-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cart-item-id {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .cart-item-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-abandoned {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #cce5ff;
            color: #004085;
        }

        .cart-item-details {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .response-area {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shopping-cart"></i> Cart Management</h1>
            <p class="subtitle">Manage customer carts and abandoned cart recovery</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCarts">-</div>
                <div class="stat-label">Total Carts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeCarts">-</div>
                <div class="stat-label">Active Carts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="abandonedCarts">-</div>
                <div class="stat-label">Abandoned</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalValue">$0</div>
                <div class="stat-label">Total Value</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2><i class="fas fa-cogs"></i> Cart Management</h2>
                <div style="margin-bottom: 25px;">
                    <button onclick="loadCartStats()" class="btn"><i class="fas fa-sync-alt"></i> Refresh Stats</button>
                    <button onclick="loadActiveCarts()" class="btn"><i class="fas fa-list"></i> Load Active Carts</button>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-search"></i> Cart ID to Lookup</label>
                    <input type="text" id="lookupCartId" placeholder="Enter Cart ID">
                    <button onclick="lookupCart()" class="btn"><i class="fas fa-search"></i> Lookup Cart</button>
                </div>

                <div class="form-group">
                    <button onclick="clearAbandonedCarts()" class="btn btn-warning"><i class="fas fa-trash"></i> Clear Abandoned Carts</button>
                </div>

                <div class="form-group">
                    <button onclick="clearAllCarts()" class="btn btn-danger"><i class="fas fa-database"></i> Clear All Carts</button>
                </div>

                <div class="response-area" id="managementResponse"></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-chart-line"></i> Recent Cart Activity</h2>
                <div class="loading" id="loadingCarts">
                    <div class="spinner"></div>
                    <p>Loading cart data...</p>
                </div>
                <div class="cart-list" id="cartList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadCartStats();
        });

        async function loadCartStats() {
            try {
                // Mock stats for demonstration
                const stats = {
                    totalCarts: 45,
                    activeCarts: 12,
                    abandonedCarts: 28,
                    totalValue: 1250.75
                };
                
                document.getElementById('totalCarts').textContent = stats.totalCarts;
                document.getElementById('activeCarts').textContent = stats.activeCarts;
                document.getElementById('abandonedCarts').textContent = stats.abandonedCarts;
                document.getElementById('totalValue').textContent = `$${stats.totalValue.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadActiveCarts() {
            const loading = document.getElementById('loadingCarts');
            const cartList = document.getElementById('cartList');
            
            loading.style.display = 'block';
            cartList.innerHTML = '';

            try {
                // Mock cart data for demonstration
                const mockCarts = [
                    { id: 'CART-001', userId: 'user1@example.com', itemCount: 3, totalValue: 89.99, status: 'active', lastUpdated: new Date().toISOString() },
                    { id: 'CART-002', userId: 'user2@example.com', itemCount: 1, totalValue: 25.50, status: 'abandoned', lastUpdated: new Date(Date.now() - 3600000).toISOString() },
                    { id: 'CART-003', userId: 'user3@example.com', itemCount: 5, totalValue: 156.75, status: 'active', lastUpdated: new Date().toISOString() }
                ];

                mockCarts.forEach(cart => {
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <div class="cart-item-header">
                            <div class="cart-item-id">Cart ID: ${cart.id}</div>
                            <span class="cart-item-status status-${cart.status}">${cart.status}</span>
                        </div>
                        <div class="cart-item-details">
                            User: ${cart.userId}<br>
                            Items: ${cart.itemCount} | Value: $${cart.totalValue}<br>
                            Last Updated: ${new Date(cart.lastUpdated).toLocaleString()}
                        </div>
                    `;
                    cartList.appendChild(cartItem);
                });
            } catch (error) {
                cartList.innerHTML = '<div class="error">Error loading carts: ' + error.message + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        async function lookupCart() {
            const cartId = document.getElementById('lookupCartId').value;
            if (!cartId) {
                displayResponse('managementResponse', { error: 'Please enter a Cart ID' }, false);
                return;
            }

            try {
                // Mock cart lookup
                const mockCart = {
                    id: cartId,
                    userId: 'user@example.com',
                    items: [
                        { productId: 1, name: 'Cinnamon Sticks', quantity: 2, price: 15.99 },
                        { productId: 2, name: 'Cinnamon Powder', quantity: 1, price: 12.50 }
                    ],
                    totalValue: 44.48,
                    status: 'active',
                    createdAt: new Date().toISOString()
                };

                displayResponse('managementResponse', mockCart, true);
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function clearAbandonedCarts() {
            const confirmClear = confirm(
                `Are you sure you want to clear all abandoned carts?\n\n` +
                `This will:\n` +
                `• Remove all carts that haven't been updated in 24+ hours\n` +
                `• This action cannot be undone`
            );

            if (!confirmClear) {
                displayResponse('managementResponse', { message: 'Operation cancelled by user' }, true);
                return;
            }

            try {
                // Mock clearing abandoned carts
                displayResponse('managementResponse', {
                    success: true,
                    message: 'Abandoned carts cleared successfully',
                    clearedCount: 15,
                    timestamp: new Date().toISOString()
                }, true);
                
                loadCartStats();
                loadActiveCarts();
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function clearAllCarts() {
            const confirmClear = confirm(
                `⚠️ WARNING: Are you sure you want to clear ALL carts?\n\n` +
                `This will:\n` +
                `• Remove ALL customer carts from the system\n` +
                `• This action CANNOT be undone\n\n` +
                `Type "CLEAR" in the next dialog to confirm.`
            );

            if (!confirmClear) {
                displayResponse('managementResponse', { message: 'Operation cancelled by user' }, true);
                return;
            }

            const clearText = prompt('Type "CLEAR" to confirm deletion of ALL cart data:');
            if (clearText !== "CLEAR") {
                displayResponse('managementResponse', { message: 'Operation cancelled - incorrect confirmation text' }, true);
                return;
            }

            try {
                // Mock clearing all carts
                displayResponse('managementResponse', {
                    success: true,
                    message: 'ALL CART DATA CLEARED SUCCESSFULLY',
                    clearedCount: 45,
                    timestamp: new Date().toISOString()
                }, true);
                
                loadCartStats();
                loadActiveCarts();
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        function displayResponse(elementId, data, isSuccess) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleString();
            
            let responseText = `[${timestamp}] ${isSuccess ? '✅ SUCCESS' : '❌ ERROR'}\n`;
            responseText += JSON.stringify(data, null, 2);
            
            element.textContent = responseText;
            element.className = `response-area ${isSuccess ? 'success' : 'error'}`;
            
            // Auto-scroll to show the response
            element.scrollTop = element.scrollHeight;
        }
    </script>
</body>
</html>
