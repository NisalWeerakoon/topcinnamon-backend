<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamon Products - Payment Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #1e3c72;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #6c757d;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .header .subtitle {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e3c72;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: rgba(255, 255, 255, 1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00a085, #008f7a);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #d63031, #c0392b);
            box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4);
        }

        .response-area {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-cancelled {
            background: #e2e3e5;
            color: #383d41;
        }

        .payment-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .payment-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .payment-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .payment-id {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .payment-amount {
            font-size: 18px;
            font-weight: 700;
            color: #27ae60;
        }

        .payment-details {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-leaf"></i> Cinnamon Products</h1>
            <p class="subtitle">Payment Management System & Gateway Testing</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPayments">-</div>
                <div class="stat-label">Total Payments</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedPayments">-</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingPayments">-</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRevenue">$0</div>
                <div class="stat-label">Revenue (30d)</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2><i class="fas fa-credit-card"></i> Process Payment</h2>
                <form id="paymentForm">
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="paymentMethod" required>
                            <option value="CREDIT_CARD">Credit Card</option>
                            <option value="DEBIT_CARD">Debit Card</option>
                            <option value="BANK_TRANSFER">Bank Transfer</option>
                            <option value="DIGITAL_WALLET">Digital Wallet</option>
                            <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Customer Email</label>
                        <input type="email" id="customerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="customerName">
                    </div>
                    <div class="form-group">
                        <label>Card Number (for card payments)</label>
                        <input type="text" id="cardNumber" placeholder="1234567890123456">
                    </div>
                    <div class="form-group">
                        <label>Card Holder Name</label>
                        <input type="text" id="cardHolderName">
                    </div>
                    <div class="form-group">
                        <label>Expiry Month</label>
                        <input type="text" id="expiryMonth" placeholder="MM">
                    </div>
                    <div class="form-group">
                        <label>Expiry Year</label>
                        <input type="text" id="expiryYear" placeholder="YYYY">
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" id="cvv" placeholder="123">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="description">
                    </div>
                    <button type="submit" class="btn btn-success">Process Payment</button>
                </form>
                <div class="response-area" id="paymentResponse"></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-cogs"></i> Payment Management</h2>
                <div style="margin-bottom: 25px;">
                    <button onclick="loadPaymentStats()" class="btn"><i class="fas fa-sync-alt"></i> Refresh Stats</button>
                    <button onclick="loadRecentPayments()" class="btn"><i class="fas fa-list"></i> Load Payments</button>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-search"></i> Payment ID to Lookup</label>
                    <input type="text" id="lookupPaymentId" placeholder="Enter Payment ID (e.g., 0001)">
                    <button onclick="lookupPayment()" class="btn"><i class="fas fa-search"></i> Lookup Payment</button>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-undo"></i> Refund Amount ($)</label>
                    <input type="number" id="refundAmount" step="0.01" min="0.01" placeholder="0.00">
                    <button onclick="refundPayment()" class="btn btn-warning"><i class="fas fa-undo"></i> Process Refund</button>
                </div>

                <div class="form-group">
                    <button onclick="cancelPayment()" class="btn btn-danger"><i class="fas fa-times"></i> Cancel Payment</button>
                </div>

                <div class="form-group">
                    <button onclick="deletePayment()" class="btn btn-danger"><i class="fas fa-trash"></i> Delete Payment</button>
                </div>

                <div class="form-group">
                    <button onclick="clearAllPayments()" class="btn btn-danger"><i class="fas fa-database"></i> Clear All Data</button>
                </div>

                <div class="response-area" id="managementResponse"></div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-chart-line"></i> Recent Payments</h2>
            <div class="loading" id="loadingPayments">
                <div class="spinner"></div>
                <p>Loading payments...</p>
            </div>
            <div class="payment-list" id="paymentList"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let currentPaymentId = null;

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPaymentStats();
        });

        // Payment form submission
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const paymentData = {
                amount: parseFloat(document.getElementById('amount').value),
                currency: 'USD',
                paymentMethod: document.getElementById('paymentMethod').value,
                customerEmail: document.getElementById('customerEmail').value,
                customerName: document.getElementById('customerName').value,
                cardNumber: document.getElementById('cardNumber').value,
                cardHolderName: document.getElementById('cardHolderName').value,
                expiryMonth: document.getElementById('expiryMonth').value,
                expiryYear: document.getElementById('expiryYear').value,
                cvv: document.getElementById('cvv').value,
                returnUrl: 'http://localhost:3000/return',
                cancelUrl: 'http://localhost:3000/cancel',
                description: document.getElementById('description').value,
                metadata: '{"source":"dashboard"}'
            };

            try {
                const response = await fetch(`${API_BASE}/payment/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(paymentData)
                });

                const result = await response.json();
                currentPaymentId = result.paymentId;
                document.getElementById('lookupPaymentId').value = result.paymentId;
                
                displayResponse('paymentResponse', result, response.ok);
                
                if (response.ok) {
                    loadPaymentStats();
                    loadRecentPayments();
                }
            } catch (error) {
                displayResponse('paymentResponse', { error: error.message }, false);
            }
        });

        async function loadPaymentStats() {
            try {
                const response = await fetch(`${API_BASE}/payment/stats`);
                const stats = await response.json();
                
                document.getElementById('totalPayments').textContent = stats.totalPayments || 0;
                document.getElementById('completedPayments').textContent = stats.completedPayments || 0;
                document.getElementById('pendingPayments').textContent = stats.pendingPayments || 0;
                document.getElementById('totalRevenue').textContent = `$${(stats.totalRevenue || 0).toFixed(2)}`;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadRecentPayments() {
            const loading = document.getElementById('loadingPayments');
            const paymentList = document.getElementById('paymentList');
            
            loading.style.display = 'block';
            paymentList.innerHTML = '';

            try {
                // For demo purposes, we'll create some mock recent payments
                // In a real app, you'd have an endpoint to get recent payments
                const mockPayments = [
                    { paymentId: '0001', amount: 25.99, status: 'COMPLETED', customerEmail: 'test@example.com', createdAt: new Date().toISOString() },
                    { paymentId: '0002', amount: 15.50, status: 'PENDING', customerEmail: 'demo@example.com', createdAt: new Date().toISOString() },
                    { paymentId: '0003', amount: 8.75, status: 'FAILED', customerEmail: 'user@example.com', createdAt: new Date().toISOString() }
                ];

                mockPayments.forEach(payment => {
                    const paymentItem = document.createElement('div');
                    paymentItem.className = 'payment-item';
                    paymentItem.innerHTML = `
                        <div class="payment-id">Payment ID: ${payment.paymentId}</div>
                        <div class="payment-amount">$${payment.amount}</div>
                        <div class="payment-details">
                            <span class="status-indicator status-${payment.status.toLowerCase()}">${payment.status}</span>
                            <br>Customer: ${payment.customerEmail}
                            <br>Created: ${new Date(payment.createdAt).toLocaleString()}
                        </div>
                    `;
                    paymentList.appendChild(paymentItem);
                });
            } catch (error) {
                paymentList.innerHTML = '<div class="error">Error loading payments: ' + error.message + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        async function lookupPayment() {
            const paymentId = document.getElementById('lookupPaymentId').value;
            if (!paymentId) {
                displayResponse('managementResponse', { error: 'Please enter a Payment ID' }, false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/${paymentId}`);
                const result = await response.json();
                displayResponse('managementResponse', result, response.ok);
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function refundPayment() {
            const paymentId = document.getElementById('lookupPaymentId').value;
            const amount = document.getElementById('refundAmount').value;
            
            if (!paymentId || !amount) {
                displayResponse('managementResponse', { 
                    error: 'Please enter both Payment ID and refund amount',
                    details: 'Both fields are required to process a refund'
                }, false);
                return;
            }

            // Validate refund amount
            const refundAmount = parseFloat(amount);
            if (refundAmount <= 0) {
                displayResponse('managementResponse', { 
                    error: 'Invalid refund amount',
                    details: 'Refund amount must be greater than $0.00'
                }, false);
                return;
            }

            // Show confirmation dialog
            const confirmRefund = confirm(
                `Are you sure you want to refund $${refundAmount.toFixed(2)} for Payment ID: ${paymentId}?\n\n` +
                `This action will:\n` +
                `• Deduct $${refundAmount.toFixed(2)} from total sales\n` +
                `• Update payment status to REFUNDED or PARTIALLY_REFUNDED\n` +
                `• This action cannot be undone`
            );

            if (!confirmRefund) {
                displayResponse('managementResponse', { 
                    message: 'Refund cancelled by user',
                    paymentId: paymentId,
                    requestedAmount: refundAmount
                }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/${paymentId}/refund?amount=${amount}&reason=Dashboard%20refund%20-%20${new Date().toISOString()}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (response.ok) {
                    displayResponse('managementResponse', {
                        success: true,
                        message: 'Refund processed successfully',
                        paymentId: result.paymentId,
                        refundAmount: refundAmount,
                        newStatus: result.status,
                        gatewayTransactionId: result.gatewayTransactionId,
                        timestamp: new Date().toISOString()
                    }, true);
                    
                    // Clear the refund amount field
                    document.getElementById('refundAmount').value = '';
                    
                    // Refresh stats to show updated totals
                    loadPaymentStats();
                    loadRecentPayments();
                } else {
                    displayResponse('managementResponse', {
                        error: result.errorCode || 'Refund failed',
                        message: result.errorMessage || 'Unknown error occurred',
                        paymentId: paymentId,
                        requestedAmount: refundAmount
                    }, false);
                }
            } catch (error) {
                displayResponse('managementResponse', { 
                    error: 'Network error',
                    message: error.message,
                    paymentId: paymentId,
                    requestedAmount: refundAmount
                }, false);
            }
        }

        async function cancelPayment() {
            const paymentId = document.getElementById('lookupPaymentId').value;
            if (!paymentId) {
                displayResponse('managementResponse', { 
                    error: 'Please enter a Payment ID',
                    details: 'Payment ID is required to cancel a payment'
                }, false);
                return;
            }

            // Show confirmation dialog
            const confirmCancel = confirm(
                `Are you sure you want to cancel Payment ID: ${paymentId}?\n\n` +
                `This action will:\n` +
                `• Change payment status to CANCELLED\n` +
                `• Remove the payment from active sales\n` +
                `• This action cannot be undone`
            );

            if (!confirmCancel) {
                displayResponse('managementResponse', { 
                    message: 'Payment cancellation cancelled by user',
                    paymentId: paymentId
                }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/${paymentId}/cancel`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (response.ok) {
                    displayResponse('managementResponse', {
                        success: true,
                        message: 'Payment cancelled successfully',
                        paymentId: result.paymentId,
                        newStatus: result.status,
                        timestamp: new Date().toISOString()
                    }, true);
                    
                    // Refresh stats to show updated totals
                    loadPaymentStats();
                    loadRecentPayments();
                } else {
                    displayResponse('managementResponse', {
                        error: result.errorCode || 'Cancellation failed',
                        message: result.errorMessage || 'Unknown error occurred',
                        paymentId: paymentId
                    }, false);
                }
            } catch (error) {
                displayResponse('managementResponse', { 
                    error: 'Network error',
                    message: error.message,
                    paymentId: paymentId
                }, false);
            }
        }

        async function deletePayment() {
            const paymentId = document.getElementById('lookupPaymentId').value;
            if (!paymentId) {
                displayResponse('managementResponse', { 
                    error: 'Please enter a Payment ID',
                    details: 'Payment ID is required to delete a payment'
                }, false);
                return;
            }

            // Show confirmation dialog
            const confirmDelete = confirm(
                `⚠️ DANGER: Are you sure you want to DELETE Payment ID: ${paymentId}?\n\n` +
                `This action will:\n` +
                `• Permanently remove the payment from the database\n` +
                `• Remove it from all statistics and reports\n` +
                `• This action CANNOT be undone\n\n` +
                `Only PENDING or FAILED payments can be deleted.\n` +
                `COMPLETED or REFUNDED payments cannot be deleted.`
            );

            if (!confirmDelete) {
                displayResponse('managementResponse', { 
                    message: 'Payment deletion cancelled by user',
                    paymentId: paymentId
                }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/${paymentId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (response.ok) {
                    displayResponse('managementResponse', {
                        success: true,
                        message: 'Payment deleted successfully',
                        paymentId: result.paymentId,
                        deletedStatus: result.status,
                        timestamp: new Date().toISOString()
                    }, true);
                    
                    // Clear the lookup field
                    document.getElementById('lookupPaymentId').value = '';
                    
                    // Refresh stats to show updated totals
                    loadPaymentStats();
                    loadRecentPayments();
                } else {
                    displayResponse('managementResponse', {
                        error: result.errorCode || 'Deletion failed',
                        message: result.errorMessage || 'Unknown error occurred',
                        paymentId: paymentId
                    }, false);
                }
            } catch (error) {
                displayResponse('managementResponse', { 
                    error: 'Network error',
                    message: error.message,
                    paymentId: paymentId
                }, false);
            }
        }

        async function clearAllPayments() {
            // Show multiple confirmation dialogs for safety
            const firstConfirm = confirm(
                `🚨 CRITICAL WARNING 🚨\n\n` +
                `You are about to CLEAR ALL PAYMENT DATA!\n\n` +
                `This will:\n` +
                `• Delete ALL payments from the database\n` +
                `• Reset payment ID counter to 0001\n` +
                `• Clear ALL statistics and revenue data\n` +
                `• This action CANNOT be undone\n\n` +
                `Are you absolutely sure you want to continue?`
            );

            if (!firstConfirm) {
                displayResponse('managementResponse', { 
                    message: 'Database clear operation cancelled by user'
                }, true);
                return;
            }

            const secondConfirm = confirm(
                `⚠️ FINAL CONFIRMATION ⚠️\n\n` +
                `You are about to PERMANENTLY DELETE ALL DATA!\n\n` +
                `Type "CLEAR" in the next dialog to confirm.\n\n` +
                `This is your last chance to cancel.`
            );

            if (!secondConfirm) {
                displayResponse('managementResponse', { 
                    message: 'Database clear operation cancelled by user'
                }, true);
                return;
            }

            const clearText = prompt(
                `Type "CLEAR" (in capital letters) to confirm deletion of ALL payment data:`
            );

            if (clearText !== "CLEAR") {
                displayResponse('managementResponse', { 
                    message: 'Database clear operation cancelled - incorrect confirmation text'
                }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/clear-all`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (response.ok) {
                    displayResponse('managementResponse', {
                        success: true,
                        message: 'ALL PAYMENT DATA CLEARED SUCCESSFULLY',
                        details: 'Database has been reset. Payment sequence has been reset to start from 0001',
                        timestamp: new Date().toISOString(),
                        action: 'CLEAR_ALL_PAYMENTS',
                        nextPaymentId: '0001'
                    }, true);
                    
                    // Clear all form fields
                    document.getElementById('lookupPaymentId').value = '';
                    document.getElementById('refundAmount').value = '';
                    
                    // Refresh stats to show reset totals
                    loadPaymentStats();
                    loadRecentPayments();
                } else {
                    displayResponse('managementResponse', {
                        error: result.errorCode || 'Clear operation failed',
                        message: result.errorMessage || 'Unknown error occurred'
                    }, false);
                }
            } catch (error) {
                displayResponse('managementResponse', { 
                    error: 'Network error',
                    message: error.message
                }, false);
            }
        }

        function displayResponse(elementId, data, isSuccess) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleString();
            
            let responseText = `[${timestamp}] ${isSuccess ? '✅ SUCCESS' : '❌ ERROR'}\n`;
            responseText += JSON.stringify(data, null, 2);
            
            element.textContent = responseText;
            element.className = `response-area ${isSuccess ? 'success' : 'error'}`;
            
            // Auto-scroll to show the response
            element.scrollTop = element.scrollHeight;
        }
    </script>
</body>
</html>
