<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamon Products - User Management Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #1e3c72;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #6c757d;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00a085);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #00a085, #008f7a);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #d63031, #c0392b);
            box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            box-shadow: 0 4px 15px rgba(253, 203, 110, 0.3);
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4);
        }

        .user-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .user-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        .user-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .user-details {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .response-area {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-users"></i> User Management</h1>
            <p class="subtitle">Manage customer accounts and user data</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">-</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newUsersToday">-</div>
                <div class="stat-label">New Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">-</div>
                <div class="stat-label">Total Orders</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2><i class="fas fa-cogs"></i> User Management</h2>
                <div style="margin-bottom: 25px;">
                    <button onclick="loadUserStats()" class="btn"><i class="fas fa-sync-alt"></i> Refresh Stats</button>
                    <button onclick="loadAllUsers()" class="btn"><i class="fas fa-list"></i> Load All Users</button>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-search"></i> User Email to Lookup</label>
                    <input type="email" id="lookupUserEmail" placeholder="Enter user email">
                    <button onclick="lookupUser()" class="btn"><i class="fas fa-search"></i> Lookup User</button>
                </div>

                <div class="form-group">
                    <label>User Action</label>
                    <select id="userAction">
                        <option value="activate">Activate User</option>
                        <option value="deactivate">Deactivate User</option>
                        <option value="resetPassword">Reset Password</option>
                        <option value="delete">Delete User</option>
                    </select>
                    <button onclick="performUserAction()" class="btn btn-warning"><i class="fas fa-cog"></i> Perform Action</button>
                </div>

                <div class="form-group">
                    <button onclick="exportUserData()" class="btn btn-success"><i class="fas fa-download"></i> Export User Data</button>
                </div>

                <div class="response-area" id="managementResponse"></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-chart-line"></i> Recent Users</h2>
                <div class="loading" id="loadingUsers">
                    <div class="spinner"></div>
                    <p>Loading users...</p>
                </div>
                <div class="user-list" id="userList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadUserStats();
        });

        async function loadUserStats() {
            try {
                // Mock stats for demonstration
                const stats = {
                    totalUsers: 156,
                    activeUsers: 142,
                    newUsersToday: 8,
                    totalOrders: 234
                };
                
                document.getElementById('totalUsers').textContent = stats.totalUsers;
                document.getElementById('activeUsers').textContent = stats.activeUsers;
                document.getElementById('newUsersToday').textContent = stats.newUsersToday;
                document.getElementById('totalOrders').textContent = stats.totalOrders;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadAllUsers() {
            const loading = document.getElementById('loadingUsers');
            const userList = document.getElementById('userList');
            
            loading.style.display = 'block';
            userList.innerHTML = '';

            try {
                // Mock user data for demonstration
                const mockUsers = [
                    { 
                        email: 'john.doe@example.com',
                        firstName: 'John',
                        lastName: 'Doe',
                        mobile: '0771234567',
                        gender: 'Male',
                        location: 'Colombo',
                        status: 'active',
                        createdAt: new Date().toISOString(),
                        lastLogin: new Date().toISOString()
                    },
                    { 
                        email: 'jane.smith@example.com',
                        firstName: 'Jane',
                        lastName: 'Smith',
                        mobile: '0772345678',
                        gender: 'Female',
                        location: 'Kandy',
                        status: 'active',
                        createdAt: new Date(Date.now() - 86400000).toISOString(),
                        lastLogin: new Date(Date.now() - 3600000).toISOString()
                    },
                    { 
                        email: 'bob.johnson@example.com',
                        firstName: 'Bob',
                        lastName: 'Johnson',
                        mobile: '0773456789',
                        gender: 'Male',
                        location: 'Galle',
                        status: 'inactive',
                        createdAt: new Date(Date.now() - 172800000).toISOString(),
                        lastLogin: new Date(Date.now() - 259200000).toISOString()
                    }
                ];

                mockUsers.forEach(user => {
                    const userItem = document.createElement('div');
                    userItem.className = 'user-item';
                    userItem.innerHTML = `
                        <div class="user-header">
                            <div class="user-name">${user.firstName} ${user.lastName}</div>
                            <span class="user-status status-${user.status}">${user.status}</span>
                        </div>
                        <div class="user-details">
                            Email: ${user.email}<br>
                            Mobile: ${user.mobile} | Location: ${user.location}<br>
                            Joined: ${new Date(user.createdAt).toLocaleDateString()}<br>
                            Last Login: ${new Date(user.lastLogin).toLocaleString()}
                        </div>
                    `;
                    userList.appendChild(userItem);
                });
            } catch (error) {
                userList.innerHTML = '<div class="error">Error loading users: ' + error.message + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        async function lookupUser() {
            const userEmail = document.getElementById('lookupUserEmail').value;
            if (!userEmail) {
                displayResponse('managementResponse', { error: 'Please enter a user email' }, false);
                return;
            }

            try {
                // Mock user lookup
                const mockUser = {
                    email: userEmail,
                    firstName: 'John',
                    lastName: 'Doe',
                    mobile: '0771234567',
                    gender: 'Male',
                    location: 'Colombo',
                    status: 'active',
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString(),
                    totalOrders: 5,
                    totalSpent: 245.50
                };

                displayResponse('managementResponse', mockUser, true);
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function performUserAction() {
            const userEmail = document.getElementById('lookupUserEmail').value;
            const action = document.getElementById('userAction').value;
            
            if (!userEmail) {
                displayResponse('managementResponse', { error: 'Please enter a user email' }, false);
                return;
            }

            const confirmAction = confirm(
                `Are you sure you want to ${action.toUpperCase()} user ${userEmail}?\n\n` +
                `This action cannot be undone.`
            );

            if (!confirmAction) {
                displayResponse('managementResponse', { message: 'Action cancelled by user' }, true);
                return;
            }

            try {
                // Mock user action
                displayResponse('managementResponse', {
                    success: true,
                    message: `User ${action}d successfully`,
                    userEmail: userEmail,
                    action: action,
                    timestamp: new Date().toISOString()
                }, true);
                
                loadUserStats();
                loadAllUsers();
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        async function exportUserData() {
            const confirmExport = confirm(
                `Are you sure you want to export all user data?\n\n` +
                `This will generate a CSV file with all user information.`
            );

            if (!confirmExport) {
                displayResponse('managementResponse', { message: 'Export cancelled by user' }, true);
                return;
            }

            try {
                // Mock export
                displayResponse('managementResponse', {
                    success: true,
                    message: 'User data exported successfully',
                    fileName: 'users_export_' + new Date().toISOString().split('T')[0] + '.csv',
                    recordCount: 156,
                    timestamp: new Date().toISOString()
                }, true);
            } catch (error) {
                displayResponse('managementResponse', { error: error.message }, false);
            }
        }

        function displayResponse(elementId, data, isSuccess) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleString();
            
            let responseText = `[${timestamp}] ${isSuccess ? '✅ SUCCESS' : '❌ ERROR'}\n`;
            responseText += JSON.stringify(data, null, 2);
            
            element.textContent = responseText;
            element.className = `response-area ${isSuccess ? 'success' : 'error'}`;
            
            // Auto-scroll to show the response
            element.scrollTop = element.scrollHeight;
        }
    </script>
</body>
</html>
